name: Deploy site

# Builds and deploys the site to GitHub Pages, on pushes and hourly so UF
# Scheduler's course data stays current. That data is scraped on the Raspberry
# Pi (.github/uf-scheduler/pi), because UF only shows meeting times to a
# logged-in session and it only works from home; the Pi pushes it to the
# uf-data branch, and it's copied in here, never committed to main.

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 * * * *" # hourly, after the Pi's scrape at :02
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run replaces any other waiting run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.uf-data.outputs.stale }}
      login_expired: ${{ steps.uf-data.outputs.login_expired }}
    steps:
      - uses: actions/checkout@v4

      - name: Add UF Scheduler course data
        id: uf-data
        run: >
          python3 .github/uf-scheduler/fetch_data.py
          --out projects/uf-scheduler/data
          --fallback-url https://www.jacobkulberg.com/projects/uf-scheduler/data

      - uses: actions/configure-pages@v5

      # Same Jekyll build GitHub Pages runs when deploying from a branch
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs after the deploy, so a problem with the Pi's data still deploys the
  # rest of the site but fails the run, and GitHub emails about it
  uf-scheduler-data:
    needs: [build, deploy]
    if: needs.build.outputs.stale == 'true' || needs.build.outputs.login_expired == 'true'
    runs-on: ubuntu-latest
    steps:
      - if: needs.build.outputs.stale == 'true'
        run: echo "::error::UF Scheduler's course data is more than 3 hours old. Check the uf-scheduler-scrape timer on the Pi (Pi dashboard, or journalctl --user -u uf-scheduler-scrape)."
      - if: needs.build.outputs.login_expired == 'true'
        run: echo "::error::The Pi's one.uf.edu login has expired, so meeting times aren't being refreshed. Paste a fresh cookie in the Pi dashboard."
      - run: exit 1
